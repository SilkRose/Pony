[package]
name = "pony"
version = "0.0.0"
description = "Binaries for the Pony repo."
publish = false
authors = ["Silk Rose", "Meadowsys"]
edition = "2024"
license = "MIT"
repository = "https://github.com/SilkRose/Pony"

[dependencies]
async-recursion = { version = "1.1.1" }
camino = { version = "1.1.9" }
git2 = { version = "0.20.0" }
image = { version = "0.25.5" }
indoc = { version = "2.0.5" }
markdown = { version = "1.0.0-alpha.23" }
num_cpus = { version = "1.16.0" }
rand = { version = "0.9.0" }
regex = { version = "1.11.1" }
reqwest = { version = "0.12.12", features = ["json"] }
serde = { version = "1.0.218", features = ["derive"] }
serde_json = { version = "1.0.139", features = ["preserve_order"] }
tokio = { version = "1.43.0", features = ["full"] }
wiwi = { version = "0.10.0", features = ["clock-timer"] }

[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
