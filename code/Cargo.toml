[package]
name = "pony"
version = "0.0.0"
description = "Binaries for the Pony repo."
publish = false
authors = ["Silk Rose", "Meadowsys"]
edition = "2024"
license = "MIT"
repository = "https://github.com/SilkRose/Pony"

[[bin]]
doc = false
name = "fimd"
path = "src/bin/fimd.rs"
required-features = ["binary"]

[[bin]]
doc = false
name = "clean"
path = "src/bin/clean.rs"
required-features = ["binary"]

[[bin]]
doc = false
name = "create-story"
path = "src/bin/create-story-folder.rs"
required-features = ["binary"]

[[bin]]
doc = false
name = "pony-api"
path = "src/bin/pony-api.rs"
required-features = ["binary"]

[dependencies]
bon = { version = "3.10.3", optional = true }
camino = { version = "1.2.6", optional = true }
chrono = { version = "0.4.45", optional = true }
chrono-tz = { version = "0.10.4", optional = true }
const-hex = { version = "1.19.3", optional = true }
git2 = { version = "0.21.0", features = ["https"], optional = true }
image = { version = "0.25.10", optional = true }
markdown = { version = "1.0.0", optional = true }
num_cpus = { version = "1.17.0", optional = true }
rand = { version = "0.10.3", optional = true }
regex = { version = "1.13.1", optional = true }
reqwest = { version = "0.13.5", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.154", features = [
	"preserve_order",
], optional = true }
sha2 = { version = "0.11.1", optional = true }
tokio = { version = "1.54.1", features = [
	"macros",
	"time",
	"rt-multi-thread",
], optional = true }

[features]
default = [
	"binary",
	"averages",
	"bytes",
	"color",
	"command",
	"env",
	"experience",
	"fimfiction-api",
	"fs",
	"http",
	"json",
	"log",
	"markdown",
	"number-format",
	"pagination",
	"passphrase",
	"regex",
	"smart-map",
	"sprite-sheet",
	"stderr",
	"stdin",
	"string-image",
	"structs",
	"threads",
	"time",
	"traits",
	"word-stats",
]

binary = [
	"bytes",
	"fimfiction-api",
	"fs",
	"http",
	"json",
	"markdown",
	"regex",
	"stdin",
	"traits",
	"word-stats",
	"dep:const-hex",
	"dep:git2",
	"git2/https",
	"dep:serde",
	"serde/derive",
	"dep:serde_json",
	"serde_json/preserve_order",
	"dep:sha2",
	"dep:tokio",
	"tokio/macros",
	"tokio/rt-multi-thread",
]

averages = []
bytes = ["number-format"]
color = ["dep:serde", "serde/derive"]
command = []
env = []
experience = []
fimfiction-api = ["dep:reqwest", "dep:serde", "serde/derive"]
fs = ["dep:camino"]
http = ["time", "dep:reqwest", "dep:tokio", "tokio/time"]
json = [
	"dep:serde",
	"serde/derive",
	"dep:serde_json",
	"serde_json/preserve_order",
]
log = ["fs", "dep:chrono"]
markdown = ["dep:markdown"]
number-format = ["dep:bon"]
pagination = []
passphrase = ["dep:rand"]
regex = ["dep:regex"]
smart-map = []
sprite-sheet = ["dep:image"]
stderr = []
stdin = []
string-image = ["color", "fs", "dep:image"]
structs = ["dep:serde", "serde/derive"]
threads = ["dep:num_cpus"]
time = ["number-format", "dep:tokio", "tokio/time"]
traits = []
word-stats = ["markdown", "dep:regex"]

[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
