[package]
name = "pony"
version = "0.0.0"
description = "Binaries for the Pony repo."
publish = false
authors = ["Silk Rose", "Meadowsys"]
edition = "2024"
license = "MIT"
repository = "https://github.com/SilkRose/Pony"

[dependencies]
camino = { version = "1.1.11" }
chrono-tz = { version = "0.10.4" }
git2 = { version = "0.20.2" }
image = { version = "0.25.6" }
indoc = { version = "2.0.6" }
markdown = { version = "1.0.0" }
num_cpus = { version = "1.17.0" }
rand = { version = "0.9.2" }
regex = { version = "1.11.1" }
reqwest = { version = "0.12.22", features = ["json"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.142", features = ["preserve_order"] }
tokio = { version = "1.47.1", features = ["full"] }
wiwi = { version = "0.10.0", features = ["clock-timer"] }

[profile.dev]
opt-level = 0
debug-assertions = true
debug = true
incremental = true

[profile.release]
strip = true
opt-level = 3
debug-assertions = false
lto = true
codegen-units = 1
